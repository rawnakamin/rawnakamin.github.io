<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Materials | Rawnak Amin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f9fb;
      --ink: #1e2a3a;
      --muted: #5a6b80;
      --rule: #d6dee8;
      --accent: #4a6a8f;
      --panel: #eaf0f6;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --sans: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #141a22;
        --ink: #e3e9f0;
        --muted: #9aabbf;
        --rule: #2a3644;
        --accent: #9db6d6;
        --panel: #1b2430;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.0625rem;
      line-height: 1.6;
    }
    a { color: var(--accent); text-underline-offset: 0.18em; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

    main { max-width: 42rem; margin: 0 auto; padding: 3.5rem 1.5rem 4rem; }
    h1 { font-size: 1.85rem; line-height: 1.15; font-weight: 600; margin: 0 0 0.5rem; }
    .intro { font-family: var(--sans); color: var(--muted); margin: 0 0 2rem; }

    .docs { list-style: none; padding: 0; margin: 0; }
    .docs li {
      background: var(--panel);
      border-left: 4px solid var(--accent);
      border-radius: 0 4px 4px 0;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .docs a { font-weight: 600; }
    .docs .desc {
      font-family: var(--sans);
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0.2rem 0 0;
    }
    .back { font-family: var(--sans); font-size: 0.95rem; margin-top: 2.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Materials</h1>
    <p class="intro">Documents for your reference.</p>

    <ul class="docs">
      <li>
        <a href="files/rs.pdf">Research Statement</a>
        <p class="desc">Last updated November 16, 2026.</p>
      </li>
      <li>
        <a href="files/ts.pdf">Teaching Statement</a>
        <p class="desc">Last updated November, 16, 2026.</p>
      </li>
      <li>
        <a href="files/ds.pdf">Diversity Statement</a>
        <p class="desc">Last updated November 13, 2026.</p>
      </li>
      <!-- <li>
        <a href="files/placeholder.pdf">Document 4 title</a>
        <p class="desc">Short description</p>
      </li> -->
    </ul>

    <p class="back"><a href="index.html">Back to main page</a></p>
  </main>
</body>
</html>
